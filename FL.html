<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="theme-color" content="#143c5a">
<title>Lista de deseos – Martimac</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f0f0f0; color: #1a1a1a; min-height: 100vh; padding-bottom: 90px;
  }
  .fl-header {
    background: #143c5a; color: #fff; padding: 18px 16px 14px;
    position: sticky; top: 0; z-index: 50;
  }
  .fl-header h1 { font-size: 18px; font-weight: 700; }
  .fl-header .fl-sub { font-size: 13px; color: rgba(255,255,255,.75); margin-top: 3px; }
  .fl-search-wrap { padding: 12px 16px 0; }
  .fl-search {
    width: 100%; padding: 11px 14px; border-radius: 10px; border: 1.5px solid #e5e7eb;
    font-size: 14px; outline: none; background: #fff;
  }
  .fl-search:focus { border-color: #143c5a; }
  .fl-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px; padding: 14px 16px 24px;
  }
  .fl-empty { text-align: center; padding: 60px 20px; color: #9ca3af; font-size: 14px; }

  .product-card {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 14px;
    overflow: hidden; transition: all .2s; display: flex; flex-direction: column;
  }
  .product-card.desc-card { border: 2px solid #dc2626; }
  .product-img-wrap {
    position: relative; aspect-ratio: 1/1; background: #fff;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .product-img { max-width: 96%; max-height: 96%; object-fit: contain; }
  .product-img-placeholder { font-size: 48px; opacity: .4; }
  .product-info { padding: 12px 14px; flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .product-name {
    font-size: 13.5px; font-weight: 600; color: #143c5a; line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; min-height: 2.7em;
  }
  .product-meta-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .product-code { font-size: 11px; font-weight: 700; color: #143c5a; white-space: nowrap; }
  .product-price { font-size: 18px; font-weight: 700; color: #111827; }
  .product-price .price-symbol { font-size: 11px; font-weight: 600; }
  .desc-original-price { font-size: 70%; color: #9ca3af; text-decoration: line-through; }
  .desc-tag {
    display: inline-block; background: #dc2626; color: #fff; font-size: 11px; font-weight: 700;
    padding: 3px 9px; border-radius: 999px; letter-spacing: .4px;
  }
  .desc-limit-chip { font-size: 11px; color: #dc2626; font-weight: 600; margin-top: 3px; }
  .add-btn {
    width: 100%; padding: 9px; margin-top: 4px;
    background: #e5e7eb; border: 1.5px solid #e5e7eb; border-radius: 8px;
    font-size: 13px; font-weight: 600; color: #374151; cursor: pointer; transition: all .2s;
  }
  .add-btn:hover { background: #143c5a; color: #fff; border-color: #143c5a; }
  .add-btn.added { background: #d1fae5; color: #065f46; border-color: #6ee7b7; }

  /* Carrito flotante */
  .fl-cart-fab {
    position: fixed; bottom: 20px; right: 20px; z-index: 60;
    background: #143c5a; color: #fff; border: none; border-radius: 999px;
    padding: 14px 22px; font-size: 15px; font-weight: 700; cursor: pointer;
    box-shadow: 0 8px 24px rgba(0,0,0,.25); display: none; align-items: center; gap: 8px;
  }
  .fl-cart-fab.show { display: inline-flex; }
  .fl-cart-badge {
    background: #dc2626; color: #fff; border-radius: 999px; font-size: 12px; font-weight: 800;
    min-width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; padding: 0 5px;
  }

  .fl-modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 200;
    display: none; align-items: flex-end; justify-content: center; padding: 0;
  }
  .fl-modal.open { display: flex; }
  .fl-modal-card {
    background: #fff; border-radius: 20px 20px 0 0; width: 100%; max-width: 560px;
    max-height: 88vh; overflow-y: auto; padding: 20px; box-shadow: 0 -8px 32px rgba(0,0,0,.2);
  }
  @media (min-width: 640px) {
    .fl-modal { align-items: center; }
    .fl-modal-card { border-radius: 20px; max-height: 85vh; }
  }
  .fl-modal-hd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .fl-modal-hd h2 { font-size: 17px; font-weight: 700; color: #143c5a; }
  .fl-modal-close {
    border: none; background: #f3f4f6; color: #374151; border-radius: 8px;
    padding: 6px 11px; cursor: pointer; font-size: 14px; font-weight: 600;
  }
  .fl-cart-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f3f4f6;
  }
  .fl-cart-item:last-child { border-bottom: none; }
  .fl-ci-info { flex: 1; min-width: 0; }
  .fl-ci-name { font-size: 13px; font-weight: 600; color: #143c5a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fl-ci-price { font-size: 12px; color: #6b7280; margin-top: 2px; }
  .fl-qty-stepper { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .fl-qty-btn {
    width: 28px; height: 28px; border-radius: 8px; border: 1.5px solid #e5e7eb; background: #fff;
    font-size: 16px; font-weight: 700; color: #143c5a; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .fl-qty-val { min-width: 20px; text-align: center; font-size: 14px; font-weight: 700; }
  .fl-ci-remove { border: none; background: none; color: #d1d5db; font-size: 16px; cursor: pointer; padding: 0 2px; flex-shrink: 0; }
  .fl-ci-remove:hover { color: #dc2626; }
  .fl-cart-total { display: flex; justify-content: space-between; align-items: center; padding: 14px 0 6px; font-size: 15px; font-weight: 700; color: #143c5a; }
  .fl-name-field { margin: 10px 0 6px; }
  .fl-name-field label { display: block; font-size: 12px; font-weight: 700; color: #6b7280; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
  .fl-name-field input {
    width: 100%; padding: 11px 14px; border: 1.5px solid #e5e7eb; border-radius: 9px; font-size: 14px; outline: none;
  }
  .fl-name-field input:focus { border-color: #143c5a; }
  .fl-submit-btn {
    width: 100%; padding: 13px; margin-top: 10px; background: #143c5a; color: #fff; border: none;
    border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .fl-submit-btn:disabled { opacity: .5; cursor: not-allowed; }
  .fl-cart-empty { text-align: center; padding: 40px 10px; color: #9ca3af; font-size: 14px; }

  .fl-fullscreen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; }
  .fl-fullscreen-card { max-width: 380px; }
  .fl-fullscreen-icon { font-size: 52px; margin-bottom: 14px; }
  .fl-fullscreen-title { font-size: 19px; font-weight: 700; color: #143c5a; margin-bottom: 8px; }
  .fl-fullscreen-msg { font-size: 14px; color: #6b7280; line-height: 1.6; }
  .fl-fullscreen-btn {
    margin-top: 20px; padding: 12px 24px; background: #143c5a; color: #fff; border: none;
    border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer;
  }

  .fl-toast {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%) translateY(-20px);
    background: #1a1a1a; color: #fff; padding: 11px 20px; border-radius: 10px; font-size: 13px;
    font-weight: 600; z-index: 999; opacity: 0; transition: all .25s; pointer-events: none;
  }
  .fl-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="fl-loading" class="fl-fullscreen">
  <div class="fl-fullscreen-card">
    <div class="fl-fullscreen-icon">🎁</div>
    <div class="fl-fullscreen-title">Cargando…</div>
  </div>
</div>

<div id="fl-invalid" class="fl-fullscreen" style="display:none;">
  <div class="fl-fullscreen-card">
    <div class="fl-fullscreen-icon">🔗</div>
    <div class="fl-fullscreen-title">Este link no es válido</div>
    <div class="fl-fullscreen-msg">Pídele a tu familiar que te comparta el link de nuevo desde la app.</div>
  </div>
</div>

<div id="fl-success" class="fl-fullscreen" style="display:none;">
  <div class="fl-fullscreen-card">
    <div class="fl-fullscreen-icon">✅</div>
    <div class="fl-fullscreen-title">¡Lista enviada!</div>
    <div class="fl-fullscreen-msg" id="fl-success-msg"></div>
    <button class="fl-fullscreen-btn" onclick="flReset()">Armar otra lista</button>
  </div>
</div>

<div id="fl-app" style="display:none;">
  <div class="fl-header">
    <h1>🎁 Lista de deseos</h1>
    <div class="fl-sub" id="fl-header-sub">Para: —</div>
  </div>
  <div class="fl-search-wrap">
    <input type="text" id="fl-search" class="fl-search" placeholder="Buscar producto…" oninput="flRenderGrid()">
  </div>
  <div id="fl-grid" class="fl-grid"></div>
</div>

<button class="fl-cart-fab" id="fl-cart-fab" onclick="flOpenCart()">
  🛒 Ver lista <span class="fl-cart-badge" id="fl-cart-badge">0</span>
</button>

<div class="fl-modal" id="fl-cart-modal" onclick="if(event.target===this)flCloseCart()">
  <div class="fl-modal-card">
    <div class="fl-modal-hd">
      <h2>Tu lista de deseos</h2>
      <button class="fl-modal-close" onclick="flCloseCart()">✕</button>
    </div>
    <div id="fl-cart-body"></div>
    <div id="fl-cart-footer" style="display:none;">
      <div class="fl-cart-total"><span>Total</span><span id="fl-cart-total-val">₡0</span></div>
      <div class="fl-name-field">
        <label>Tu nombre</label>
        <input type="text" id="fl-name-input" placeholder="Ej: María Rodríguez" maxlength="80">
      </div>
      <button class="fl-submit-btn" id="fl-submit-btn" onclick="flSubmitWishlist()">📤 Enviar lista de deseos</button>
    </div>
  </div>
</div>

<div id="fl-toast" class="fl-toast"></div>

<script>
const SUPABASE_URL = 'https://uzfmpctopzvneykqwxny.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV6Zm1wY3RvcHp2bmV5a3F3eG55Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3ODcwOTMsImV4cCI6MjA5NDM2MzA5M30.lbdpd2hWRhM7qsmR4LePs0A5G_lKEweYcp-uoz8Yv5M';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let CATALOG = [];
let flCart  = [];
let flColaboradorCedula = null;
let flColaboradorNombre = '';

/* ── Catálogo: copiado tal cual de index.html (funciones puras, sin DOM) ──
   No se comparte un archivo entre ambos a propósito, para no tocar el
   index.html que ya está en producción. Si cambia la lógica de precios en
   index.html, hay que replicar el cambio acá también. */
function isScheduleActive(inicio, fin) {
  const now = Date.now();
  if (inicio && now < new Date(inicio).getTime()) return false;
  if (fin && now > new Date(fin).getTime()) return false;
  return true;
}

function mapProductRow(r) {
  const descRaw = !!r.descuento;
  return {
    id: r.codigo, n: r.nombre, b: r.marca,
    spc: r.spc, c: r.categoria, s: r.subcategoria,
    pr: r.precio, img: r.imagen,
    iva: r.iva != null ? r.iva : 13,
    activo: r.activo !== false,
    stock: r.stock != null ? r.stock : null,
    descuento: descRaw && isScheduleActive(r.descuento_inicio, r.descuento_fin),
    descPct: r.porcentaje_descuento || 0,
    limite: (r.limite_por_usuario != null && isScheduleActive(r.limite_inicio, r.limite_fin)) ? r.limite_por_usuario : null,
  };
}

async function loadCatalog() {
  const { data, error } = await sb.from('productos').select('*').eq('activo', true).order('nombre');
  if (error) { console.error(error); return; }
  CATALOG = (data || []).map(mapProductRow);
}

function priceIva(p) {
  const rate = p.iva != null ? p.iva : 13;
  return Math.round(p.pr * (1 + rate / 100));
}
function priceDiscounted(p) {
  if (p.descuento && p.descPct) return Math.round(priceIva(p) * (1 - p.descPct / 100));
  return priceIva(p);
}
function priceEffective(p) { return p.descuento ? priceDiscounted(p) : priceIva(p); }

function escHtml(s) { return String(s || '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function escAttr(s) { return escHtml(s).replace(/"/g, '&quot;'); }

/* ── Toast ── */
let _toastTimer = null;
function flToast(msg) {
  const el = document.getElementById('fl-toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

/* ── Render de tarjetas (misma apariencia que el catálogo normal) ── */
function renderFamilyCard(p) {
  let priceHtml;
  if (p.descuento && p.descPct && p.pr > 0) {
    priceHtml = `<div class="desc-original-price"><span class="price-symbol">₡</span>${priceIva(p).toLocaleString('es-CR')}</div>`
      + `<div class="product-price"><span class="price-symbol">₡</span>${priceDiscounted(p).toLocaleString('es-CR')}</div>`;
  } else {
    priceHtml = `<div class="product-price">${p.pr > 0 ? '<span class="price-symbol">₡</span>' + priceIva(p).toLocaleString('es-CR') : 'Consultar'}</div>`;
  }
  const descChip = p.descuento
    ? `<div style="margin-top:5px;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;">
        <span class="desc-tag">DESCUENTO ${p.descPct}%</span>
       </div>`
    : '';
  const inCart = flCart.find(i => i.product.id === p.id);
  return `
    <div class="product-card${p.descuento ? ' desc-card' : ''}">
      <div class="product-img-wrap">
        ${p.img ? `<img src="${escAttr(p.img)}" alt="${escAttr(p.n)}" class="product-img" loading="lazy" onerror="this.style.display='none';this.parentElement.querySelector('.product-img-placeholder').style.display='flex'">` : ''}
        <div class="product-img-placeholder" style="${p.img ? 'display:none' : 'display:flex'}">🧴</div>
      </div>
      <div class="product-info">
        <div class="product-name">${escHtml(p.n)}</div>
        <div class="product-meta-row">
          <div class="product-code">${escHtml(p.id)}</div>
          <div>${priceHtml}</div>
        </div>
        ${descChip}
        <button class="add-btn${inCart ? ' added' : ''}" onclick="flAddToCart('${p.id.replace(/'/g,"\\'")}')">
          ${inCart ? `✓ En tu lista (${inCart.qty})` : 'Agregar'}
        </button>
      </div>
    </div>`;
}

function flRenderGrid() {
  const grid = document.getElementById('fl-grid');
  const q = (document.getElementById('fl-search').value || '').trim().toLowerCase();
  let list = CATALOG;
  if (q) {
    list = list.filter(p =>
      (p.n || '').toLowerCase().includes(q) ||
      (p.id || '').toLowerCase().includes(q) ||
      (p.b || '').toLowerCase().includes(q)
    );
  }
  if (!list.length) {
    grid.innerHTML = '<div class="fl-empty" style="grid-column:1/-1;">No se encontraron productos.</div>';
    return;
  }
  grid.innerHTML = list.map(renderFamilyCard).join('');
}

/* ── Carrito ── */
function flAddToCart(id) {
  const p = CATALOG.find(x => x.id === id);
  if (!p) return;
  const existing = flCart.find(i => i.product.id === id);
  if (existing) existing.qty++;
  else flCart.push({ product: p, qty: 1 });
  flUpdateCartUI();
  flRenderGrid();
  flToast(`Agregado: ${p.n}`);
}

function flUpdateQty(id, delta) {
  const item = flCart.find(i => i.product.id === id);
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) flCart = flCart.filter(i => i.product.id !== id);
  flUpdateCartUI();
  flRenderCartBody();
  flRenderGrid();
}

function flRemoveItem(id) {
  flCart = flCart.filter(i => i.product.id !== id);
  flUpdateCartUI();
  flRenderCartBody();
  flRenderGrid();
}

function flUpdateCartUI() {
  const totalQty = flCart.reduce((s, i) => s + i.qty, 0);
  const fab = document.getElementById('fl-cart-fab');
  const badge = document.getElementById('fl-cart-badge');
  badge.textContent = totalQty;
  fab.classList.toggle('show', totalQty > 0);
}

function flOpenCart() {
  flRenderCartBody();
  document.getElementById('fl-cart-modal').classList.add('open');
}
function flCloseCart() {
  document.getElementById('fl-cart-modal').classList.remove('open');
}

function flRenderCartBody() {
  const body   = document.getElementById('fl-cart-body');
  const footer = document.getElementById('fl-cart-footer');
  if (!flCart.length) {
    body.innerHTML = '<div class="fl-cart-empty">Todavía no agregaste ningún producto.</div>';
    footer.style.display = 'none';
    return;
  }
  footer.style.display = 'block';
  body.innerHTML = flCart.map(i => {
    const p = i.product;
    const subtotal = priceEffective(p) * i.qty;
    return `<div class="fl-cart-item">
      <div class="fl-ci-info">
        <div class="fl-ci-name">${escHtml(p.n)}</div>
        <div class="fl-ci-price">₡${subtotal.toLocaleString('es-CR')}</div>
      </div>
      <div class="fl-qty-stepper">
        <button class="fl-qty-btn" onclick="flUpdateQty('${p.id.replace(/'/g,"\\'")}',-1)">−</button>
        <span class="fl-qty-val">${i.qty}</span>
        <button class="fl-qty-btn" onclick="flUpdateQty('${p.id.replace(/'/g,"\\'")}',1)">+</button>
      </div>
      <button class="fl-ci-remove" onclick="flRemoveItem('${p.id.replace(/'/g,"\\'")}')">✕</button>
    </div>`;
  }).join('');
  const total = flCart.reduce((s, i) => s + priceEffective(i.product) * i.qty, 0);
  document.getElementById('fl-cart-total-val').textContent = '₡' + total.toLocaleString('es-CR');
}

async function flSubmitWishlist() {
  const nombre = (document.getElementById('fl-name-input').value || '').trim();
  if (!nombre) { flToast('Escribe tu nombre para poder identificar tu lista'); return; }
  if (!flCart.length) { flToast('Tu lista está vacía'); return; }

  const btn = document.getElementById('fl-submit-btn');
  btn.disabled = true; btn.textContent = 'Enviando…';

  const items = flCart.map(i => ({
    codigo: i.product.id,
    nombre: i.product.n,
    cantidad: i.qty,
    precio_unitario: priceEffective(i.product)
  }));

  const { error } = await sb.from('family_wishlists').insert({
    colaborador_cedula: flColaboradorCedula,
    familiar_nombre: nombre,
    items
  });

  btn.disabled = false; btn.textContent = '📤 Enviar lista de deseos';

  if (error) { flToast('Error al enviar: ' + error.message); return; }

  document.getElementById('fl-success-msg').textContent =
    `Le avisamos a ${flColaboradorNombre || 'tu familiar'} que armaste tu lista, ${nombre}. Cuando la revise y confirme el pedido, te va a llegar.`;
  flCloseCart();
  document.getElementById('fl-app').style.display = 'none';
  document.getElementById('fl-cart-fab').classList.remove('show');
  document.getElementById('fl-success').style.display = 'flex';
}

function flReset() {
  flCart = [];
  document.getElementById('fl-name-input').value = '';
  flUpdateCartUI();
  document.getElementById('fl-success').style.display = 'none';
  document.getElementById('fl-app').style.display = 'block';
  flRenderGrid();
}

/* ── Arranque ── */
async function flInit() {
  const token = new URLSearchParams(location.search).get('t');
  if (!token) { flShowInvalid(); return; }

  const { data, error } = await sb.from('usuarios')
    .select('cedula,nombre')
    .eq('family_token', token)
    .maybeSingle();

  if (error || !data) { flShowInvalid(); return; }

  flColaboradorCedula = data.cedula;
  flColaboradorNombre = data.nombre;
  document.getElementById('fl-header-sub').textContent = `Para: ${data.nombre}`;

  await loadCatalog();

  document.getElementById('fl-loading').style.display = 'none';
  document.getElementById('fl-app').style.display = 'block';
  flRenderGrid();
}

function flShowInvalid() {
  document.getElementById('fl-loading').style.display = 'none';
  document.getElementById('fl-invalid').style.display = 'flex';
}

flInit();
</script>
</body>
</html>
